<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setu NDRF Basecamp Map</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map { height: calc(100vh - 80px); width: 100%; z-index: 1; }
        
        /* Safe Status (Green Dot) */
        .safe-marker {
            background-color: #10b981; /* Tailwind emerald-500 */
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }

        /* Emergency Status (Pulsing Red) */
        .pulse-marker {
            background-color: #ef4444; /* Tailwind red-500 */
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white overflow-hidden font-sans">

    <header class="h-20 bg-gray-800 border-b border-gray-700 flex items-center justify-between px-6">
        <div class="flex items-center gap-4">
            <div class="w-4 h-4 bg-red-600 rounded-full animate-pulse"></div>
            <h1 class="text-2xl font-bold tracking-widest text-gray-100">SETU <span class="text-red-500">BASECAMP COMMAND</span></h1>
        </div>
        <div class="flex items-center gap-6">
            <div class="text-gray-400 text-sm">
                Mesh Anchors: <span class="text-green-400 font-bold">5 ONLINE</span> | Auto-sync: 5s
            </div>
            <a href="/radar/" target="_blank" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm font-bold transition-colors">
                Open Field Radar ↗
            </a>
        </div>
    </header>

    <div class="flex w-full">
        <!-- Sidebar -->
        <div class="w-1/3 bg-gray-900 border-r border-gray-700 h-[calc(100vh-80px)] overflow-y-auto p-4 flex flex-col">
            <h2 class="text-lg font-bold text-gray-400 mb-4 border-b border-gray-700 pb-2">LIVE SOS FEED (MACRO VIEW)</h2>
            <div id="sos-list" class="flex flex-col gap-3 flex-grow">
                <p class="text-gray-500 text-sm italic">Listening for LoRa mesh signals...</p>
            </div>
            <div class="mt-4 p-4 bg-gray-800 rounded border border-gray-700 text-xs text-gray-400">
                <p><strong>Node Anchoring Active:</strong> Automatically grouping victims by street node to prevent GPS scatter during heavy cloud cover.</p>
            </div>
        </div>

        <!-- Interactive Map -->
        <div class="w-2/3">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // 1. Initialize Map (Centered exactly on Nandyal, AP)
        const map = L.map('map').setView([15.4795, 78.4820], 15);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        // 2. Define the Hardware Nodes (Streetlights in Nandyal)
        const staticNodes = {
            "SETU_NODE_042": { name: "Nandyal Main Road Pole A", lat: 15.4800, lng: 78.4800 },
            "SETU_NODE_043": { name: "Nandyal Main Road Pole B", lat: 15.4820, lng: 78.4810 },
            "SETU_NODE_044": { name: "Nandyal Main Road Pole C", lat: 15.4780, lng: 78.4790 },
            "SETU_NODE_045": { name: "Railway Station Approach 1", lat: 15.4750, lng: 78.4850 },
            "SETU_NODE_046": { name: "Railway Station Approach 2", lat: 15.4730, lng: 78.4870 }
        };

        const safeIcon = L.divIcon({ className: 'custom-div-icon', html: `<div class="safe-marker"></div>`, iconSize: [14, 14], iconAnchor: [7, 7] });
        const dangerIcon = L.divIcon({ className: 'custom-div-icon', html: `<div class="pulse-marker"></div>`, iconSize: [20, 20], iconAnchor: [10, 10] });

        let nodeMarkers = {}; // Stores the physical map markers

        // 3. Initialize all nodes as "Safe" on the map
        for (const [nodeId, data] of Object.entries(staticNodes)) {
            const marker = L.marker([data.lat, data.lng], {icon: safeIcon}).addTo(map);
            
            // Default safe popup
            marker.bindPopup(`
                <div class="text-gray-900 font-sans p-2 text-center">
                    <h3 class="font-extrabold text-lg border-b pb-1 text-gray-700">${nodeId}</h3>
                    <p class="text-sm mt-2 font-bold text-green-600">STATUS: ONLINE</p>
                    <p class="text-sm text-gray-600">Active Civilians: 0</p>
                </div>
            `);
            nodeMarkers[nodeId] = marker;
        }

        // 4. Fetch Database and Update Nodes
        async function fetchAndUpdateMap() {
            try {
                const response = await fetch('/api/get_alerts/');
                const data = await response.json();
                const sosListDiv = document.getElementById('sos-list');
                
                // Track total people per node
                let nodeAggregates = {
                    "SETU_NODE_042": 0, "SETU_NODE_043": 0, "SETU_NODE_044": 0, 
                    "SETU_NODE_045": 0, "SETU_NODE_046": 0
                };

                if (data.alerts.length > 0) {
                    sosListDiv.innerHTML = ''; 
                } else {
                    sosListDiv.innerHTML = '<p class="text-green-500 text-sm font-bold">No active emergencies detected.</p>';
                }

                // Process each SOS alert
                data.alerts.forEach(alert => {
                    const nId = alert.node_id;
                    
                    // Increment the people counter for this specific node
                    if (nodeAggregates[nId] !== undefined) {
                        nodeAggregates[nId] += parseInt(alert.people_count);
                    }

                    // Populate the left sidebar with individual victim details
                    const card = `
                        <div class="bg-gray-800 p-4 rounded-lg border-l-4 border-red-500 shadow-lg relative">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-white text-lg">${alert.victim_name}</h3>
                                <span class="bg-red-900 text-red-300 text-xs px-2 py-1 rounded font-bold">${alert.people_count} Person(s)</span>
                            </div>
                            <p class="text-sm text-gray-300 mb-1">Condition: <span class="text-yellow-400">${alert.medical_status}</span></p>
                            <p class="text-xs text-gray-400 font-mono">Anchor: ${alert.node_id}</p>
                        </div>
                    `;
                    sosListDiv.innerHTML += card;
                });

                // Update Map Markers based on aggregates
                for (const [nodeId, totalPeople] of Object.entries(nodeAggregates)) {
                    if (totalPeople > 0) {
                        // Change to emergency icon
                        nodeMarkers[nodeId].setIcon(dangerIcon);
                        
                        // Update popup with emergency UI and dispatch button
                        nodeMarkers[nodeId].setPopupContent(`
                            <div class="text-gray-900 font-sans p-2">
                                <h3 class="font-extrabold text-xl mb-1 border-b pb-1 text-red-600">${nodeId}</h3>
                                <p class="text-sm mt-2 text-gray-600">Location: ${staticNodes[nodeId].name}</p>
                                <div class="bg-red-100 p-2 rounded mt-2 text-center">
                                    <p class="text-lg font-black text-red-700">${totalPeople} Civilians Stranded</p>
                                </div>
                                <button onclick="alert('Dispatch order sent to nearest NDRF unit.')" class="mt-3 bg-red-600 text-white px-3 py-2 rounded text-sm w-full font-bold hover:bg-red-700 transition-colors shadow-lg">
                                    DISPATCH RESCUE TEAM
                                </button>
                            </div>
                        `);
                    } else {
                        // Reset to safe icon if everyone is marked rescued
                        nodeMarkers[nodeId].setIcon(safeIcon);
                        nodeMarkers[nodeId].setPopupContent(`
                            <div class="text-gray-900 font-sans p-2 text-center">
                                <h3 class="font-extrabold text-lg border-b pb-1 text-gray-700">${nodeId}</h3>
                                <p class="text-sm mt-2 font-bold text-green-600">STATUS: ONLINE</p>
                                <p class="text-sm text-gray-600">Active Civilians: 0</p>
                            </div>
                        `);
                    }
                }
            } catch (error) {
                console.error("Failed to sync with Django backend:", error);
            }
        }

        fetchAndUpdateMap();
        setInterval(fetchAndUpdateMap, 5000);
    </script>
</body>
</html>
